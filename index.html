<!doctype html>

<html>
  <head>
    <title>Sign Up form</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section>
        <form action="" method="post">
		<h1>Signup</h1>
          <input type="text" name="" id="" placeholder="Full Name" required/>
          <input type="email" name="" id="" placeholder="Email" required/>
          <input type="password" name="" id="" placeholder="Password" required/>
          <input type="password" name="" id="" placeholder="Confirm password" required/>
          <input type="text" name="" id="" placeholder="DD/MM/YY" required/>
          <div>
            <input type="radio" name="position" id="position_stu" required/>
            <label for="position_stu">Student</label>
            <input type="radio" name="position" id="position_emp" required/>
            <label for="position_emp">Employee</label>
          </div>
          <div>
            <input type="checkbox" name="" id="check" required/>
            <label for="check">I agree to all the Terms and conditions</label>
          </div>
          <button type="submit">Signup</button>
        </form>
    </section>
  </body>
</html>
